{
  "test_key": "mediation",
  "method_id": "linear_mediation_sobel",
  "display_name": "Mediation / indirect effect",
  "endpoint_family": "continuous",
  "design_family": "mediation",
  "estimand": "Product-of-coefficients indirect effect a*b in a specified linear mediation model.",
  "hypothesis": {
    "null": "a*b = 0",
    "alternative": "a*b differs from or exceeds 0",
    "effect_measure": "indirect_effect",
    "beneficial_direction": "higher_or_lower_explicit"
  },
  "inputs": [
    {
      "name": "path_a",
      "definition": "Exposure-to-mediator coefficient.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": null,
      "default": null,
      "clinical_interpretation": "Exposure-to-mediator coefficient."
    },
    {
      "name": "path_b",
      "definition": "Mediator-to-outcome coefficient conditional on exposure.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": null,
      "default": null,
      "clinical_interpretation": "Mediator-to-outcome coefficient conditional on exposure."
    },
    {
      "name": "sigma_x",
      "definition": "SD of exposure.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": {
        "exclusive_minimum": 0
      },
      "default": null,
      "clinical_interpretation": "SD of exposure."
    },
    {
      "name": "sigma_m",
      "definition": "Residual SD of mediator.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": {
        "exclusive_minimum": 0
      },
      "default": null,
      "clinical_interpretation": "Residual SD of mediator."
    },
    {
      "name": "sigma_y",
      "definition": "Residual SD of outcome.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": {
        "exclusive_minimum": 0
      },
      "default": null,
      "clinical_interpretation": "Residual SD of outcome."
    },
    {
      "name": "alpha",
      "definition": "Overall type-I error probability.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": {
        "exclusive_minimum": 0,
        "exclusive_maximum": 1
      },
      "default": 0.05,
      "clinical_interpretation": "Maximum prespecified probability of a false positive across the tested hypothesis."
    },
    {
      "name": "power",
      "definition": "Target probability of rejecting the null under the design alternative.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": {
        "exclusive_minimum": 0,
        "exclusive_maximum": 1
      },
      "default": 0.8,
      "clinical_interpretation": "Target probability of rejecting the null under the design alternative."
    },
    {
      "name": "dropout_rate",
      "definition": "Expected proportion without an analyzable primary endpoint.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": {
        "minimum": 0,
        "exclusive_maximum": 1
      },
      "default": 0,
      "clinical_interpretation": "Anticipated loss applied only after the analysis-required sample size is obtained."
    }
  ],
  "alpha": {
    "sidedness": "one_or_two_sided",
    "convention": "Overall alpha; one-sided uses alpha and two-sided divides alpha equally between tails."
  },
