  "endpoint_family": "continuous_pk",
  "design_family": "bioequivalence",
  "estimand": "Geometric mean ratio on the log scale.",
  "hypothesis": {
    "null": "GMR <= lower_limit OR GMR >= upper_limit",
    "alternative": "lower_limit < GMR < upper_limit",
    "effect_measure": "geometric_mean_ratio",
    "beneficial_direction": "inside_equivalence_interval"
  },
  "inputs": [
    {
      "name": "cv",
