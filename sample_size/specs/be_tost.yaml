    "Reproduce official package examples for the pinned version.",
    "Compare forward power and inverse sample-size results on a prespecified grid.",
    "Verify null-boundary type-I error and clinically relevant alternatives independently.",
    "2x2: evaluable_total 24 with dropout_rate 0.10 yields randomized_total 28 and 14 subjects in each of TR and RT.",
    "Parallel: evaluable_total 24 with dropout_rate 0.10 yields randomized_total 28 and 14 subjects in each treatment arm."
