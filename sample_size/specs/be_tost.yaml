      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": {
        "exclusive_minimum": 0
      },
      "default": null,
      "clinical_interpretation": "Within-subject coefficient of variation.",
      "required_for_solve_modes": [
        "sample_size",
        "power"
      ],
      "allowed_for_solve_modes": [
        "sample_size",
        "power"
      ]
    },
    {
      "name": "theta0",
      "definition": "Expected geometric mean ratio.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": {
        "exclusive_minimum": 0
      },
      "default": null,
      "clinical_interpretation": "Expected geometric mean ratio.",
      "required_for_solve_modes": [
        "sample_size",
        "power"
      ],
      "allowed_for_solve_modes": [
        "sample_size",
        "power"
      ]
    },
    {
      "name": "lower_limit",
      "definition": "Lower bioequivalence limit.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": {
        "exclusive_minimum": 0
      },
      "default": null,
      "clinical_interpretation": "Lower bioequivalence limit.",
      "required_for_solve_modes": [
        "sample_size",
        "power"
      ],
      "allowed_for_solve_modes": [
        "sample_size",
        "power"
      ]
    },
    {
      "name": "upper_limit",
      "definition": "Upper bioequivalence limit.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": {
        "exclusive_minimum": 0
      },
      "default": null,
      "clinical_interpretation": "Upper bioequivalence limit.",
      "required_for_solve_modes": [
        "sample_size",
        "power"
      ],
      "allowed_for_solve_modes": [
        "sample_size",
        "power"
      ]
