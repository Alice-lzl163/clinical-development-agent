  "specification_status": "SPEC_FROZEN",
  "design_components": [],
  "derived_parameters": [
    {
      "name": "randomization_block_size",
      "formula": "2 if design in {'2x2', 'parallel'}",
      "inputs": [
        "design"
      ],
      "output_unit": "subjects",
      "assumptions": [
        "Only balanced 2x2 and balanced parallel designs are frozen."
      ]
    },
    {
      "name": "randomized_total",
      "formula": "ceil(ceil(evaluable_total / (1 - dropout_rate)) / randomization_block_size) * randomization_block_size",
      "inputs": [
        "evaluable_total",
        "dropout_rate",
        "randomization_block_size"
      ],
      "output_unit": "subjects",
      "assumptions": [
        "Dropout inflation occurs after PowerTOST returns evaluable total sample size."
      ]
    },
    {
      "name": "randomized_per_sequence_or_arm",
      "formula": "randomized_total / 2",
      "inputs": [
        "randomized_total"
      ],
      "output_unit": "subjects per sequence or arm",
      "assumptions": [
        "The randomized total is an even multiple of the two-person balance block."
