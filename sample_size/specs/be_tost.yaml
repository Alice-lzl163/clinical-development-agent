    {
      "name": "design",
      "definition": "PowerTOST design code.",
      "type": "string",
      "unit": "category",
      "required": true,
      "valid_range": {
        "allowed_values": [
          "2x2",
          "parallel"
        ]
      },
      "default": null,
      "clinical_interpretation": "PowerTOST design code.",
      "required_for_solve_modes": [
        "sample_size",
        "power"
      ],
      "allowed_for_solve_modes": [
        "sample_size",
        "power"
      ]
    },
    {
      "name": "alpha",
      "definition": "Overall type-I error probability.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": {
        "exclusive_minimum": 0,
        "exclusive_maximum": 1
      },
      "default": 0.05,
      "clinical_interpretation": "Maximum prespecified probability of a false positive across the tested hypothesis.",
      "required_for_solve_modes": [
        "sample_size",
        "power"
      ],
      "allowed_for_solve_modes": [
        "sample_size",
        "power"
      ]
    },
    {
      "name": "power",
      "definition": "Target probability of rejecting the null under the design alternative.",
      "type": "number",
      "unit": "dimensionless",
      "required": false,
      "valid_range": {
        "exclusive_minimum": 0,
        "exclusive_maximum": 1
      },
      "default": 0.8,
      "clinical_interpretation": "Target probability of rejecting the null under the design alternative.",
