{
  "test_key": "cox_covariate",
  "method_id": "cox_covariate_effect",
  "display_name": "Cox regression with covariate R²",
  "endpoint_family": "time_to_event",
  "design_family": "regression",
  "estimand": "Target Cox regression coefficient/hazard ratio.",
  "hypothesis": {
    "null": "coefficient = 0 (HR = 1)",
    "alternative": "coefficient differs from or exceeds 0",
    "effect_measure": "hazard_ratio",
    "beneficial_direction": "lower_or_higher_explicit"
  },
  "inputs": [
    {
      "name": "alternative_hazard_ratio",
      "definition": "Hazard ratio per unit/contrast of the target covariate.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": {
        "exclusive_minimum": 0
      },
      "default": null,
      "clinical_interpretation": "Hazard ratio per unit/contrast of the target covariate."
    },
    {
      "name": "covariate_type",
      "definition": "Target covariate type.",
      "type": "string",
      "unit": "category",
      "required": true,
      "valid_range": {
        "allowed_values": [
          "binary",
          "continuous"
        ]
      },
      "default": null,
      "clinical_interpretation": "Target covariate type."
    },
    {
      "name": "binary_pilot_data",
      "definition": "Pilot vectors X1, X2, and failureFlag required when covariate_type is binary.",
      "type": "object",
      "unit": "subject-level pilot data",
      "required": false,
      "valid_range": null,
      "default": null,
      "clinical_interpretation": "Empirical joint covariate and event information used by ssizeEpi; it is not replaced by a marginal prevalence."
    },
    {
      "name": "covariate_variance",
      "definition": "Variance of the target covariate required when covariate_type is continuous.",
      "type": "number",
      "unit": "squared covariate units",
      "required": false,
      "valid_range": {
        "exclusive_minimum": 0
      },
      "default": null,
      "clinical_interpretation": "Planned variance of the continuous prognostic/exposure covariate."
    },
    {
      "name": "event_probability",
      "definition": "Probability of observing the event during study.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": {
        "minimum": 0,
        "maximum": 1
      },
      "default": null,
      "clinical_interpretation": "Probability of observing the event during study."
    },
    {
      "name": "r_squared_other_covariates",
      "definition": "R-squared of target covariate explained by other covariates.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": {
        "minimum": 0,
        "maximum": 1
      },
      "default": null,
      "clinical_interpretation": "R-squared of target covariate explained by other covariates."
    },
    {
      "name": "alpha",
      "definition": "Overall type-I error probability.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": {
        "exclusive_minimum": 0,
        "exclusive_maximum": 1
      },
      "default": 0.05,
      "clinical_interpretation": "Maximum prespecified probability of a false positive across the tested hypothesis."
    },
    {
      "name": "power",
      "definition": "Target probability of rejecting the null under the design alternative.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": {
        "exclusive_minimum": 0,
        "exclusive_maximum": 1
      },
      "default": 0.8,
      "clinical_interpretation": "Target probability of rejecting the null under the design alternative."
    },
    {
      "name": "dropout_rate",
      "definition": "Expected proportion without an analyzable primary endpoint.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": {
        "minimum": 0,
        "exclusive_maximum": 1
      },
      "default": 0,
      "clinical_interpretation": "Anticipated loss applied only after the analysis-required sample size is obtained."
    }
  ],
  "alpha": {
    "sidedness": "one_or_two_sided",
    "convention": "Overall alpha; one-sided uses alpha and two-sided divides alpha equally between tails."
  },
  "allocation": {
