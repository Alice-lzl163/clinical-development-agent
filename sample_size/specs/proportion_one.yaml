test_key: proportion_one
method_id: binary_one_sample_arcsine
display_name: One-sample proportion
endpoint_family: binary
design_family: one_sample
estimand: Treatment-group event probability p minus the fixed reference probability
  p0.
hypothesis:
  'null': p = null_probability
  alternative: p differs from, exceeds, or is below null_probability as selected by
    alternative
  effect_measure: one_sample_probability_contrast
  beneficial_direction: Declared by alternative; event desirability is not inferred.
inputs:
- name: null_probability
  definition: Fixed null event probability.
  type: number
  unit: dimensionless
  required: true
  valid_range:
    minimum: 0
    maximum: 1
  default: null
  clinical_interpretation: Fixed null event probability.
  required_for_solve_modes: &id001
  - sample_size
  - power
  allowed_for_solve_modes: *id001
- name: alternative_probability
  definition: Design alternative event probability.
  type: number
  unit: dimensionless
  required: true
  valid_range:
    minimum: 0
    maximum: 1
  default: null
  clinical_interpretation: Design alternative event probability.
  required_for_solve_modes: *id001
  allowed_for_solve_modes: *id001
- name: alpha
  definition: Overall type-I error probability.
  type: number
  unit: dimensionless
  required: true
  valid_range:
    exclusive_minimum: 0
    exclusive_maximum: 1
  default: 0.05
  clinical_interpretation: Maximum prespecified probability of a false positive across
    the tested hypothesis.
  required_for_solve_modes: *id001
  allowed_for_solve_modes: *id001
- name: power
  definition: Target probability of rejecting the null under the design alternative.
  type: number
  unit: dimensionless
  required: true
  valid_range:
    exclusive_minimum: 0
    exclusive_maximum: 1
  default: 0.8
  clinical_interpretation: Target probability of rejecting the null under the design
    alternative.
  required_for_solve_modes: &id002
  - sample_size
  allowed_for_solve_modes: *id002
- name: dropout_rate
  definition: Expected proportion without an analyzable primary endpoint.
  type: number
  unit: dimensionless
  required: true
  valid_range:
    minimum: 0
    exclusive_maximum: 1
  default: 0
  clinical_interpretation: Anticipated loss applied only after the analysis-required
    sample size is obtained.
  required_for_solve_modes: *id002
  allowed_for_solve_modes: *id002
- name: alternative
  definition: 'Prespecified direction: two_sided, greater, or less.'
  type: string
  unit: category
  required: true
  valid_range:
    allowed_values:
    - two_sided
    - greater
    - less
  default: null
  clinical_interpretation: 'Prespecified direction: two_sided, greater, or less.'
  required_for_solve_modes: *id001
  allowed_for_solve_modes: *id001
- name: analyzable_sample_size
  definition: Number of participants with analyzable binary outcomes.
  type: integer
  unit: participants
  required: true
  valid_range:
    minimum: 2
  default: null
  clinical_interpretation: Number of participants with analyzable binary outcomes.
  required_for_solve_modes:
  - power
  allowed_for_solve_modes:
  - power
alpha:
  sidedness: one_or_two_sided
  convention: Overall alpha; one-sided uses alpha and two-sided divides alpha equally
    between tails.
allocation:
  ratio_definition: Not applicable.
  supported: false
  rounding_rule: Not applicable.
solve_modes:
  sample_size: true
  power: true
  events: false
  operating_characteristics: false
engine:
  engine_family: pwr
  package: pwr
  package_version_policy: Pin exact validated version in the project lockfile; any
    version change triggers documented revalidation.
  function: pwr::pwr.p.test
  parameter_mapping:
  - package_argument: h
    source_type: derived_parameter
    source: signed_cohen_h
    transformation: null
  - package_argument: n
    source_type: clinical_input
    source: analyzable_sample_size
    transformation: NULL in sample_size mode; required in power mode
  - package_argument: sig.level
    source_type: clinical_input
    source: alpha
    transformation: null
  - package_argument: power
    source_type: clinical_input
    source: power
    transformation: NULL in power mode; required in sample_size mode
  - package_argument: alternative
    source_type: clinical_input
    source: alternative
    transformation: two_sided -> two.sided
  output_mapping:
  - package_output: n
    semantic_output: analyzable_sample_size
    unit: participants
  - package_output: power
    semantic_output: achieved_power
    unit: probability
  runtime: R
  formal_arguments:
  - name: h
    required: false
    package_default: null
    semantic_role: Signed arcsine-scale effect.
  - name: n
    required: false
    package_default: null
    semantic_role: Analyzable participants; unknown for inversion.
  - name: sig.level
    required: false
    package_default: 0.05
    semantic_role: Overall alpha.
  - name: power
    required: false
    package_default: null
    semantic_role: Target or solved power.
  - name: alternative
    required: false
    package_default: c("two.sided", "less", "greater")
    semantic_role: Prespecified tail direction.
method_type: analytical_asymptotic
dropout_handling: After analyzable N is determined, inflate each applicable analyzable
  group or pair total using ceil(n / (1 - dropout_rate)); dropout never changes the
  statistical calculation.
rounding_rule: Ceil the authoritative analyzable quantity, derive integer group quantities
  under the declared allocation, then apply dropout inflation per group; no randomized
  N is accepted as a power input.
assumptions:
- The binary endpoint model and one_sample design are correctly specified.
- All required design-identifying inputs are fixed prospectively and use mutually
  consistent units, orientation, and analysis populations.
- The planned primary analysis matches the hypothesis and engine mapping in this specification.
unsupported_domains:
- Exact-binomial design claims; this method is the declared arcsine asymptotic approximation.
- Clustered, stratified, covariate-adjusted, or repeated-measure binary outcomes.
- null_probability equal to alternative_probability or a directional alternative inconsistent
  with the signed effect.
- Power mode supplied with randomized rather than analyzable N.
warnings: []
validation_grade: V2
migration_action: KEEP
lifecycle_status: VALIDATION_PENDING
primary_reference: Chow et al.
package_reference: https://search.r-project.org/CRAN/refmans/TrialSize/html/00Index.html
guideline_reference: ICH E9
benchmark_requirements:
- Enumerate binomial rejection regions for small n and compare asymptotic results
  at large n
- Reproduce official package examples for the pinned version.
- Compare forward power and inverse sample-size results on a prespecified grid.
- Verify null-boundary type-I error and clinically relevant alternatives independently.
specification_status: SPEC_FROZEN
design_components: []
derived_parameters:
- name: signed_cohen_h
  formula: 2*asin(sqrt(alternative_probability)) - 2*asin(sqrt(null_probability))
  inputs:
  - alternative_probability
  - null_probability
  output_unit: dimensionless
  assumptions:
  - The public probabilities retain p1/p0 orientation; sign is checked against alternative.
