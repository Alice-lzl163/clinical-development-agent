{
  "test_key": "ttest_ind",
  "method_id": "mean_t_two_sample",
  "display_name": "Two independent means",
  "endpoint_family": "continuous",
  "design_family": "fixed_parallel",
  "estimand": "Difference in population means.",
  "hypothesis": {
    "null": "mean_treatment - mean_control = 0",
    "alternative": "mean_treatment - mean_control differs from or exceeds 0 as prespecified",
    "effect_measure": "mean_difference",
    "beneficial_direction": "higher_or_lower_as_prespecified"
  },
  "inputs": [
    {
      "name": "standardized_effect",
      "definition": "Absolute mean difference divided by the relevant SD.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": {
        "exclusive_minimum": 0
      },
      "default": null,
      "clinical_interpretation": "Absolute mean difference divided by the relevant SD."
    },
    {
      "name": "allocation_ratio",
      "definition": "Planned treatment-to-control sample-size ratio n_treatment / n_control.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": {
        "exclusive_minimum": 0
      },
      "default": 1,
      "clinical_interpretation": "Planned treatment-to-control sample-size ratio n_treatment / n_control."
    },
    {
      "name": "alpha",
      "definition": "Overall type-I error probability.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": {
        "exclusive_minimum": 0,
        "exclusive_maximum": 1
      },
      "default": 0.05,
      "clinical_interpretation": "Maximum prespecified probability of a false positive across the tested hypothesis."
    },
    {
      "name": "power",
      "definition": "Target probability of rejecting the null under the design alternative.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": {
        "exclusive_minimum": 0,
        "exclusive_maximum": 1
      },
      "default": 0.8,
      "clinical_interpretation": "Target probability of rejecting the null under the design alternative."
    },
    {
      "name": "dropout_rate",
      "definition": "Expected proportion without an analyzable primary endpoint.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": {
        "minimum": 0,
        "exclusive_maximum": 1
      },
      "default": 0,
      "clinical_interpretation": "Anticipated loss applied only after the analysis-required sample size is obtained."
    }
  ],
  "alpha": {
    "sidedness": "one_or_two_sided",
    "convention": "Overall alpha; one-sided uses alpha and two-sided divides alpha equally between tails."
  },
  "allocation": {
    "ratio_definition": "n_treatment / n_control",
    "supported": true,
    "rounding_rule": "Return integer arm sizes satisfying allocation; round upward and re-evaluate achieved power."
  },
  "solve_modes": {
    "sample_size": true,
    "power": true,
    "events": false,
    "operating_characteristics": false
  },
  "engine": {
    "engine_family": "pwr_t",
    "type": "exact_package",
    "package": "pwr",
    "package_version_policy": "Pin exact validated version in the project lockfile; any version change triggers documented revalidation.",
    "function": "pwr::pwr.t.test",
    "function_signature": "pwr.t.test(n = NULL, d = NULL, sig.level = 0.05, power = NULL, type = c(\"two.sample\", \"one.sample\", \"paired\"), alternative = c(\"two.sided\", \"less\", \"greater\"))",
    "parameter_mapping": {
      "standardized_effect": "d",
      "alpha": "sig.level",
      "power": "power",
      "alternative": "alternative",
      "design_constant": "type = two.sample"
    },
    "output_mapping": {
      "n": "per-arm sample size before allocation/dropout"
    }
  },
  "method_type": "exact_package",
  "dropout_handling": "Inflate the analysis-required total using ceil(N / (1 - dropout_rate)); round randomized arm totals afterward.",
  "rounding_rule": "Return integer arm sizes satisfying allocation; round upward and re-evaluate achieved power.",
  "assumptions": [
    "The continuous endpoint model and fixed_parallel design are correctly specified.",
