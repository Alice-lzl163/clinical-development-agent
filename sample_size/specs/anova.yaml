{
  "test_key": "anova",
  "method_id": "anova_oneway_balanced",
  "display_name": "Balanced one-way ANOVA",
  "endpoint_family": "continuous",
  "design_family": "fixed_multi_arm",
  "estimand": "Omnibus between-group variance relative to within-group variance.",
  "hypothesis": {
    "null": "all group means equal",
    "alternative": "at least one group mean differs",
    "effect_measure": "cohen_f",
    "beneficial_direction": "larger_between_group_dispersion"
  },
  "inputs": [
    {
      "name": "groups",
      "definition": "Number of randomized groups.",
      "type": "integer",
      "unit": "groups",
      "required": true,
      "valid_range": {
        "minimum": 2
      },
      "default": null,
      "clinical_interpretation": "Number of randomized groups."
    },
    {
      "name": "cohen_f",
      "definition": "Cohen's omnibus f effect size.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": {
        "exclusive_minimum": 0
      },
      "default": null,
      "clinical_interpretation": "Cohen's omnibus f effect size."
    },
    {
      "name": "alpha",
      "definition": "Overall type-I error probability.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": {
        "exclusive_minimum": 0,
        "exclusive_maximum": 1
      },
      "default": 0.05,
      "clinical_interpretation": "Maximum prespecified probability of a false positive across the tested hypothesis."
    },
    {
      "name": "power",
      "definition": "Target probability of rejecting the null under the design alternative.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": {
        "exclusive_minimum": 0,
        "exclusive_maximum": 1
      },
      "default": 0.8,
      "clinical_interpretation": "Target probability of rejecting the null under the design alternative."
    },
    {
      "name": "dropout_rate",
      "definition": "Expected proportion without an analyzable primary endpoint.",
      "type": "number",
      "unit": "dimensionless",
      "required": true,
      "valid_range": {
        "minimum": 0,
        "exclusive_maximum": 1
      },
      "default": 0,
      "clinical_interpretation": "Anticipated loss applied only after the analysis-required sample size is obtained."
    }
  ],
  "alpha": {
    "sidedness": "not_applicable",
    "convention": "Upper-tail omnibus F test; alpha is the total type-I error for that test."
  },
  "allocation": {
    "ratio_definition": "Equal allocation across all groups is required.",
    "supported": false,
    "rounding_rule": "Round total N upward to a multiple of groups; retain equal integer group sizes and re-evaluate power."
  },
  "solve_modes": {
    "sample_size": true,
    "power": true,
    "events": false,
    "operating_characteristics": false
  },
  "engine": {
    "engine_family": "pwr_anova",
    "package": "pwr",
    "package_version_policy": "Pin exact validated version in the project lockfile; any version change triggers documented revalidation.",
    "function": "pwr::pwr.anova.test",
    "parameter_mapping": [
      {
        "package_argument": "k",
        "source_type": "clinical_input",
        "source": "groups",
        "transformation": null
      },
      {
        "package_argument": "f",
        "source_type": "clinical_input",
        "source": "cohen_f",
        "transformation": null
      },
      {
        "package_argument": "sig.level",
        "source_type": "clinical_input",
        "source": "alpha",
        "transformation": null
      },
      {
        "package_argument": "power",
        "source_type": "clinical_input",
        "source": "power",
        "transformation": null
      }
    ],
    "output_mapping": [
      {
        "package_output": "n",
        "semantic_output": "analyzable_sample_size_per_group",
        "unit": "subjects per group"
      }
    ],
    "runtime": "R",
    "formal_arguments": [
      {
        "name": "k",
        "required": false,
        "package_default": "NULL",
        "semantic_role": "Package formal populated from one or more declared user inputs or derived quantities in parameter_mapping."
      },
      {
        "name": "n",
        "required": false,
        "package_default": "NULL",
        "semantic_role": "Package-level control/default; the adapter may use it only as declared by the frozen method specification."
      },
      {
        "name": "f",
        "required": false,
        "package_default": "NULL",
        "semantic_role": "Package formal populated from one or more declared user inputs or derived quantities in parameter_mapping."
      },
      {
        "name": "sig.level",
        "required": false,
        "package_default": "0.05",
        "semantic_role": "Package formal populated from one or more declared user inputs or derived quantities in parameter_mapping."
      },
      {
        "name": "power",
        "required": false,
        "package_default": "NULL",
        "semantic_role": "Package formal populated from one or more declared user inputs or derived quantities in parameter_mapping."
      }
    ]
  },
  "method_type": "analytical_exact",
  "dropout_handling": "Inflate each equal-sized group separately as ceil(analyzable_per_group / (1 - dropout_rate)); randomized_total is groups * randomized_per_group.",
  "rounding_rule": "Ceil package n to analyzable subjects per group, preserve equal group sizes, then apply dropout inflation and ceiling separately per group.",
  "assumptions": [
    "The continuous endpoint model and fixed_multi_arm design are correctly specified.",
    "All required design-identifying inputs are fixed prospectively and use mutually consistent units, orientation, and analysis populations.",
    "The planned primary analysis matches the hypothesis and engine mapping in this specification."
  ],
  "unsupported_domains": [],
  "warnings": [],
  "validation_grade": "V1",
  "migration_action": "KEEP",
  "lifecycle_status": "VALIDATION_PENDING",
  "primary_reference": "Cohen (1988)",
  "package_reference": "https://cran.r-project.org/package=pwr",
  "guideline_reference": "ICH E9; FDA Multiple Endpoints where contrasts are confirmatory",
  "benchmark_requirements": [
    "Compare with noncentral-F calculations and simulation under balanced designs",
    "Reproduce official package examples for the pinned version.",
    "Compare forward power and inverse sample-size results on a prespecified grid.",
    "Verify null-boundary type-I error and clinically relevant alternatives independently.",
    "For groups = 3 and package n = 32, require analyzable_per_group = 32 and analyzable_total = 96; reject total N = 32."
  ],
  "specification_status": "SPEC_FROZEN",
  "design_components": [],
  "derived_parameters": [
    {
      "name": "analyzable_per_group",
      "formula": "ceil(package_n)",
      "inputs": [
        "package_n"
      ],
      "output_unit": "subjects per group",
      "assumptions": [
        "pwr::pwr.anova.test returns n per group."
      ]
    },
    {
      "name": "analyzable_total",
      "formula": "groups * analyzable_per_group",
      "inputs": [
        "groups",
        "analyzable_per_group"
      ],
      "output_unit": "subjects",
      "assumptions": [
        "All groups have the same analyzable size."
      ]
    },
    {
      "name": "randomized_per_group",
      "formula": "ceil(analyzable_per_group / (1 - dropout_rate))",
      "inputs": [
        "analyzable_per_group",
        "dropout_rate"
      ],
      "output_unit": "subjects per group",
      "assumptions": [
        "Dropout inflation is applied identically to each group."
      ]
    },
    {
      "name": "randomized_total",
      "formula": "groups * randomized_per_group",
      "inputs": [
        "groups",
        "randomized_per_group"
      ],
      "output_unit": "subjects",
      "assumptions": [
        "Equal integer group sizes are preserved."
      ]
    }
  ]
}
