  "derived_parameters": [
    {
      "name": "signed_standardized_effect",
      "formula": "standardized effect magnitude * multiplier selected by alternative",
      "inputs": [
        "standardized_effect",
        "alternative"
      ],
      "output_unit": "dimensionless",
      "assumptions": [
        "Two-sided power is symmetric; positive magnitude is the canonical representation."
      ],
      "transformation_type": "conditional",
      "cases": {
        "greater": {
          "multiplier": 1
        },
        "less": {
          "multiplier": -1
        },
        "two_sided": {
          "multiplier": 1
        }
