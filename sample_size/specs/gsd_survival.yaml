    {
      "name": "lambda_control",
      "formula": "log(2) / survival_endpoint.control_median",
      "inputs": [
        "survival_endpoint.control_median"
      ],
      "output_unit": "hazard per time",
      "assumptions": [
        "Exponential event times."
      ]
    },
    {
      "name": "lambda_treatment",
      "formula": "survival_endpoint.alternative_hazard_ratio * lambda_control",
      "inputs": [
        "survival_endpoint.alternative_hazard_ratio",
        "lambda_control"
      ],
      "output_unit": "hazard per time",
      "assumptions": [
        "Proportional exponential hazards."
      ]
    },
    {
      "name": "dropout_hazard",
      "formula": "-log(1 - dropout.cumulative_dropout_probability) / dropout.dropout_horizon; 0 when probability is 0",
      "inputs": [
        "dropout.cumulative_dropout_probability",
        "dropout.dropout_horizon"
      ],
      "output_unit": "hazard per time",
      "assumptions": [
        "Exponential independent dropout; dropout_horizon is required when probability > 0."
      ]
    }
