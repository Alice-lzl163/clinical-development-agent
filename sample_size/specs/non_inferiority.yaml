        "minimum": 0,
        "maximum": 1
      },
      "default": null,
      "clinical_interpretation": "Treatment-arm event probability."
    },
    {
      "name": "noninferiority_margin",
      "definition": "Risk-difference NI margin with explicit event orientation.",
