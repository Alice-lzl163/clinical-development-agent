schema_version: 1
status_definitions:
  QUALIFIED: Environment probe, all 24 fixtures, qualification tests, and full regression suite passed.
  TESTED_WITH_LIMITATIONS: Executed but one or more declared qualification components remain incomplete.
  UNQUALIFIED: Not executed against the complete qualification suite.
  UNSUPPORTED: Empirical evidence demonstrates the runtime cannot be supported.
acceptance_policy:
  defined_before_cross_platform_execution: true
  integer_outputs: exact_equality
  floating_outputs:
    achieved_power_absolute_tolerance: 1.0e-6
    derived_effect_absolute_tolerance: 1.0e-12
    exposed_intermediate_absolute_tolerance: 1.0e-6
  discrepancy_classes: [operating-system numerical difference, R runtime difference, R package behavior difference, architecture difference, adapter defect, specification defect, benchmark defect, tolerance issue]
