schema_version: 1
status_definitions:
  QUALIFIED: Environment probe, all 24 fixtures, qualification tests, and full regression suite passed.
  TESTED_WITH_LIMITATIONS: Executed but one or more declared qualification components remain incomplete.
  UNQUALIFIED: Not executed against the complete qualification suite.
  UNSUPPORTED: Empirical evidence demonstrates the runtime cannot be supported.
acceptance_policy:
  defined_before_cross_platform_execution: true
  integer_outputs: exact_equality
  floating_outputs:
    achieved_power_absolute_tolerance: 1.0e-6
    derived_effect_absolute_tolerance: 1.0e-12
    exposed_intermediate_absolute_tolerance: 1.0e-6
  discrepancy_classes: [operating-system numerical difference, R runtime difference, R package behavior difference, architecture difference, adapter defect, specification defect, benchmark defect, tolerance issue]
platforms:
  - operating_system: Windows
    qualification_status: QUALIFIED
    execution_status: EXECUTED
    architecture: AMD64
    Python: "3.12.7"
    SciPy: "1.18.1"
    R: "4.6.1"
    packages: {jsonlite: "2.0.0", pwr: "1.3.0", TrialSize: "1.4.1", PowerTOST: "1.5.7"}
    environment_probe: PASS
    frozen_fixtures: {passed: 24, total: 24, live_R_calls_passed: 114, live_R_calls_total: 114}
    production_qualification_tests: PASS
    full_regression_suite: {passed: 74, total: 74}
    evidence_reference: sample_size/validation/round42_evidence.json
    qualification_date: "2026-09-02"
  - operating_system: Linux
    qualification_status: UNQUALIFIED
    execution_status: NOT_EXECUTED
    architecture: null
    Python: null
    SciPy: null
    R: null
    packages: null
    evidence_reference: null
    notes: Workflow created; no result is claimed until CI evidence is returned and reviewed.
  - operating_system: macOS
    qualification_status: UNQUALIFIED
    execution_status: NOT_EXECUTED
    architecture: null
    Python: null
    SciPy: null
    R: null
    packages: null
    evidence_reference: null
    notes: Workflow created; no result is claimed until CI evidence is returned and reviewed.
