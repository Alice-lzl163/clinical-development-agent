name: Sample Size Runtime Qualification

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ["sample_size/**", "tests/**", "requirements*.txt", ".github/workflows/sample-size-runtime-qualification.yml"]
  pull_request:
    paths: ["sample_size/**", "tests/**", "requirements*.txt", ".github/workflows/sample-size-runtime-qualification.yml"]

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: pip
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true
      - name: Create artifact directory
        run: python -c "from pathlib import Path; Path('qualification-artifacts').mkdir()"
      - name: Install exact R dependencies
        run: Rscript sample_size/validation/install_r_dependencies.R qualification-artifacts/r-versions.json
      - name: Install Python validation dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Capture environment probe
        run: python -m sample_size.validation.environment_probe > qualification-artifacts/environment-probe.json
      - name: Run frozen numerical qualification
        run: python -m sample_size.validation.run_numerical_validation --evidence-output qualification-artifacts/numerical-evidence.json > qualification-artifacts/numerical-summary.json
      - name: Run Round 5 frozen qualification
        run: python -m sample_size.validation.run_round5_hosted_qualification --output qualification-artifacts/round5-evidence.json > qualification-artifacts/round5-summary.json
      - name: Run production qualification tests
        run: python -m unittest tests.test_production_qualification tests.test_round54_production_qualification -v 2>&1 | tee qualification-artifacts/production-tests.txt
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v 2>&1 | tee qualification-artifacts/full-tests.txt
      - name: Verify exact installed R versions
        run: Rscript sample_size/validation/install_r_dependencies.R qualification-artifacts/r-versions.json --verify-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sample-size-runtime-${{ matrix.os }}
          path: qualification-artifacts/
          if-no-files-found: warn
          retention-days: 30

  compare-platforms:
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12.7"}
      - name: Install comparator validation dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: sample-size-runtime-*
          path: platform-evidence
      - name: Compare frozen fixture outputs
        run: python -m sample_size.validation.compare_platform_evidence platform-evidence/*/numerical-evidence.json --expected-platform windows-latest --expected-platform ubuntu-latest --expected-platform macos-latest --output cross-platform-comparison.json
      - name: Compare Round 5 fixture outputs
        run: python -m sample_size.validation.compare_platform_evidence platform-evidence/*/round5-evidence.json --expected-platform windows-latest --expected-platform ubuntu-latest --expected-platform macos-latest --output round5-cross-platform-comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sample-size-cross-platform-comparison
          path: |
            cross-platform-comparison.json
            round5-cross-platform-comparison.json
          if-no-files-found: error
          retention-days: 30
